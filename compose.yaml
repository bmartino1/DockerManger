services:
  dockermanger:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockermanger:dev
    container_name: dockermanger
    hostname: dockermanger
    restart: unless-stopped

    ports:
      - "5001:80"
      - "2222:22"

    environment:
      TZ: ${TZ:-America/Chicago}
      STACKS_DIR: /opt/stacks

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/stacks:/opt/stacks
      - ./data:/data

    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
