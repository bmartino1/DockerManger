name: dockermanger

services:
  dockermanger:
    # -----------------------------------------------------------------------
    # Image / Build
    # -----------------------------------------------------------------------
    #
    # Clone the DockerManger repository and run:
    #
    #   docker compose up -d --build
    #
    # DockerManger is built directly from the repository Dockerfile.
    #
    build:
      context: .
      dockerfile: Dockerfile

    image: dockermanger:dev
    container_name: dockermanger
    hostname: dockermanger
    restart: unless-stopped

    # -----------------------------------------------------------------------
    # DockerManger Environment
    # -----------------------------------------------------------------------
    #
    # Runtime defaults used INSIDE the DockerManger container.
    #
    # Site-specific deployments may edit this file or replace it with another
    # env_file.
    #
    env_file:
      - ./dockerenvironment.env

    # -----------------------------------------------------------------------
    # Resource Controls
    # -----------------------------------------------------------------------
    #
    # Conservative defaults suitable for small homelab systems, including
    # Raspberry Pi deployments.
    #
    # These can be changed or removed by the deployment administrator.
    #
    mem_reservation: 512m
    mem_limit: 2g
    memswap_limit: 3g
    cpu_shares: 1024
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "dockermanger-healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

    # -----------------------------------------------------------------------
    # Web Interface
    # -----------------------------------------------------------------------
    #
    # DockerManger requires HTTPS for the application UI.
    #
    # HTTP is retained only so Nginx can serve the health/ACME paths and
    # redirect normal browser requests to the mandatory HTTPS interface.
    #
    # Default host ports:
    #
    #   HTTP  -> 5001
    #   HTTPS -> 5443
    #
    # Example:
    #
    #   http://docker-host:5001
    #
    # redirects to:
    #
    #   https://docker-host:5443
    #
    ports:
      - "${WEB_HTTP_PORT:-5001}:80"
      - "${WEB_HTTPS_PORT:-5443}:443"

    # -----------------------------------------------------------------------
    # Deployment-Specific Environment
    # -----------------------------------------------------------------------
    #
    # These values depend on Compose-side interpolation and therefore remain
    # here instead of dockerenvironment.env.
    #
    # DOCKERMANGER_HTTPS_PORT tells DockerManger/Nginx which EXTERNAL host
    # port should be used when generating HTTP -> HTTPS redirects.
    #
    environment:
      DOCKERMANGER_HTTPS_PORT: "${WEB_HTTPS_PORT:-5443}"

    # -----------------------------------------------------------------------
    # Storage / Docker Engine
    # -----------------------------------------------------------------------
    volumes:
      # Docker Engine access.
      #
      # WARNING:
      # Access to docker.sock effectively grants DockerManger administrative
      # control over the host Docker Engine.
      #
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistent DockerManger runtime data.
      #
      # TLS certificates and SSH client state live beneath /data.
      # Compose stacks are mounted separately below so /opt/stacks remains the
      # application's neutral in-container stack path.
      #
      - ./data:/data

      # Docker Compose stacks.
      #
      # A repository checkout works immediately with ./data/compose_stacks.
      # Set HOST_STACKS_DIR only when stacks already live somewhere else.
      #
      # Examples:
      #
      #   default:                         ./data/compose_stacks
      #   HOST_STACKS_DIR=/mnt/docker
      #   HOST_STACKS_DIR=/srv/docker/stacks
      #
      - "${HOST_STACKS_DIR:-./data/compose_stacks}:${STACKS_DIR:-/opt/stacks}"

    # -----------------------------------------------------------------------
    # Docker Host Access
    # -----------------------------------------------------------------------
    #
    # Provides a portable hostname DockerManger can use when connecting back
    # to the Docker host.
    #
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # -----------------------------------------------------------------------
    # Container Logging
    # -----------------------------------------------------------------------
    #
    # Prevent DockerManger container logs from growing indefinitely.
    #
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"


# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
#
# No DockerManger-specific network is currently required.
# Compose creates the normal project default network.
#
networks: {}
