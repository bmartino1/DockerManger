; ============================================================================
; DockerManger - PHP Configuration
; ============================================================================
;
; Shared PHP configuration for DockerManger.
;
; The Dockerfile installs this file for both:
;
;   PHP-FPM:
;     /etc/php/8.3/fpm/conf.d/99-dockermanger.ini
;
;   PHP CLI:
;     /etc/php/8.3/cli/conf.d/99-dockermanger.ini
;
; PHP-FPM serves the DockerManger web application.
;
; PHP CLI is available for diagnostics, maintenance, and administrative tooling.
;
; ============================================================================


; ----------------------------------------------------------------------------
; General
; ----------------------------------------------------------------------------

; DockerManger currently targets PHP 8.3 on the Ubuntu Noble base image.

; Do not expose the installed PHP version through HTTP response headers.
expose_php = Off

; Use UTF-8 by default.
default_charset = "UTF-8"

; Safe fallback timezone. The container entrypoint passes the deployment TZ
; environment value into PHP-FPM and app/src/bootstrap.php applies it at
; request startup. Keeping UTC here avoids hard-coding a site-specific zone.
date.timezone = "UTC"


; ----------------------------------------------------------------------------
; Resource Limits
; ----------------------------------------------------------------------------
;
; DockerManger performs relatively small web requests. Docker pulls, Compose
; operations, logs, and other potentially long-running work should not depend
; on PHP accepting huge request bodies.
;

memory_limit = 256M

; Normal web requests should complete quickly.
;
; Individual Docker/Compose operations that legitimately require more time
; should eventually be handled deliberately by application code rather than
; globally allowing PHP requests to run forever.
max_execution_time = 60

max_input_time = 60


; ----------------------------------------------------------------------------
; Upload / Request Limits
; ----------------------------------------------------------------------------
;
; DockerManger does not currently require large uploads.
;
; These values also remain below Nginx's:
;
;   client_max_body_size 10m
;

post_max_size = 8M
upload_max_filesize = 8M

max_input_vars = 2000


; ----------------------------------------------------------------------------
; Error Handling
; ----------------------------------------------------------------------------
;
; Never display PHP errors directly to the browser in the normal container.
; Errors should be written to Docker's logs instead.
;

display_errors = Off
display_startup_errors = Off

log_errors = On
error_reporting = E_ALL

; Send PHP errors to stderr so Docker's logging driver can collect and rotate
; them together with the rest of the DockerManger container logs.
error_log = /proc/self/fd/2


; ----------------------------------------------------------------------------
; Sessions
; ----------------------------------------------------------------------------
;
; DockerManger will eventually use authenticated PHP sessions.
;
; These defaults establish safer session behavior now so authentication does
; not require us to revisit basic PHP session handling later.
;

session.use_strict_mode = 1

; Prevent JavaScript from reading the PHP session cookie.
session.cookie_httponly = 1

; SameSite=Lax provides a useful CSRF-related browser protection while
; remaining practical for a locally hosted management interface.
session.cookie_samesite = "Lax"

; DockerManger requires HTTPS for the application UI. HTTP is retained only
; for health/ACME handling and redirecting normal requests to HTTPS.
session.cookie_secure = 1

; Only cookies are used for transporting PHP session identifiers.
session.use_only_cookies = 1

; Do not place PHP session IDs into URLs.
session.use_trans_sid = 0

; Give the session cookie a DockerManger-specific name.
session.name = DOCKERMANGERSESSID


; ----------------------------------------------------------------------------
; Filesystem / Path Handling
; ----------------------------------------------------------------------------

; Resolve filesystem paths using PHP's normal realpath cache.
;
; Compose.php will perform its own validation to guarantee that managed stack
; paths remain beneath STACKS_DIR.
realpath_cache_size = 4096K
realpath_cache_ttl = 120


; ----------------------------------------------------------------------------
; Output
; ----------------------------------------------------------------------------

; DockerManger's API will explicitly generate JSON where appropriate.
; Avoid PHP silently buffering unexpectedly large command/log responses.
output_buffering = 4096

; Compression is left disabled at PHP level. If we eventually want HTTP
; compression, Nginx is the appropriate layer to provide it.
zlib.output_compression = Off


; ----------------------------------------------------------------------------
; PHP Assertions / Development Behavior
; ----------------------------------------------------------------------------
;
; DockerManger's production-style container should not execute runtime
; assertions. Validation and error handling belong in application code.
;

zend.assertions = -1


; ----------------------------------------------------------------------------
; Security Notes
; ----------------------------------------------------------------------------
;
; We deliberately DO NOT use disable_functions to disable:
;
;   exec
;   shell_exec
;   proc_open
;   proc_close
;
; DockerManger is a Docker management application and requires controlled
; execution of Docker and Docker Compose commands.
;
; Security must therefore be enforced by the application:
;
;   - fixed executable names
;   - validated arguments
;   - escaped command arguments
;   - validated container identifiers
;   - Compose paths restricted beneath STACKS_DIR
;   - authentication before administrative actions
;   - CSRF protection for state-changing web requests
;
; Arbitrary user-supplied shell commands must never be exposed through the
; normal HTTP API.
;
; The interactive terminal is a separate PTY/WebSocket subsystem and must not
; be implemented as an arbitrary PHP command API.
;
; ============================================================================
