# ============================================================================
# DockerManger - Nginx Configuration
# ============================================================================
#
# Nginx is the HTTP/HTTPS frontend for DockerManger.
#
# Normal request flow:
#
#   Browser
#      |
#      +---- HTTP :80
#      |       |
#      |       +---- /health
#      |       |       remains available locally for Docker HEALTHCHECK
#      |       |
#      |       +---- /.well-known/acme-challenge/
#      |       |       available for ACME / Certbot HTTP-01 validation
#      |       |
#      |       +---- all other requests
#      |               redirect to HTTPS
#      |
#      +---- HTTPS :443
#              |
#              +---- Static files
#              |
#              +---- PHP requests
#                       |
#                       v
#                  PHP-FPM 8.3
#
#
# DockerManger's public web root:
#
#   /var/www/dockermanger/public
#
# Application source outside /public is intentionally not exposed directly
# by Nginx.
#
#
# TLS certificate paths:
#
#   /data/certs/dockermanger.crt
#   /data/certs/dockermanger.key
#
# A fresh DockerManger installation may generate a self-signed certificate.
# The files may later be replaced by administrator-provided or Certbot-issued
# certificates.
#
# ============================================================================


# ============================================================================
# HTTP
# ============================================================================
#
# HTTP exists primarily for:
#
#   1. HTTP -> HTTPS redirection
#   2. DockerManger's local health check
#   3. ACME / Certbot HTTP-01 challenges
#
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;


    # ------------------------------------------------------------------------
    # Docker Health Check
    # ------------------------------------------------------------------------
    #
    # scripts/healthcheck.sh requests:
    #
    #   http://127.0.0.1/health
    #
    # Keep this endpoint on HTTP so Docker's internal health check does not
    # need to validate or ignore the local TLS certificate.
    #
    # This exact location takes precedence over the general HTTPS redirect.
    #

    location = /health {
        root /var/www/dockermanger/public;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME
            /var/www/dockermanger/public/health.php;

        fastcgi_param SCRIPT_NAME
            /health.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }


    # ------------------------------------------------------------------------
    # ACME / Certbot HTTP-01 Challenge
    # ------------------------------------------------------------------------
    #
    # HTTP must remain available for deployments using the ACME HTTP-01
    # challenge.
    #
    # Certbot challenge files can be placed beneath:
    #
    #   /var/www/certbot/.well-known/acme-challenge/
    #
    # Requests to this location are NOT redirected to HTTPS.
    #

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;

        default_type "text/plain";

        try_files $uri =404;
    }


    # ------------------------------------------------------------------------
    # HTTP -> HTTPS
    # ------------------------------------------------------------------------
    #
    # DockerManger prefers encrypted browser access.
    #
    # __DOCKERMANGER_HTTPS_PORT__ is replaced during container startup with
    # the externally published HTTPS port supplied by:
    #
    #   DOCKERMANGER_HTTPS_PORT
    #
    # Default:
    #
    #   5443
    #
    # This is important because Docker may map:
    #
    #   host:5443 -> container:443
    #
    # while Nginx itself only knows that it is listening on container port
    # 443.
    #

    location / {
        return 302 https://$host:__DOCKERMANGER_HTTPS_PORT__$request_uri;
    }


    access_log /dev/stdout;
    error_log /dev/stderr warn;
}


# ============================================================================
# HTTPS
# ============================================================================

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;


    # ------------------------------------------------------------------------
    # DockerManger Web Root
    # ------------------------------------------------------------------------

    root /var/www/dockermanger/public;
    index index.php;


    # ------------------------------------------------------------------------
    # TLS Certificate
    # ------------------------------------------------------------------------
    #
    # DockerManger's startup process ensures these files exist before Nginx
    # starts when HTTPS is enabled.
    #
    # They may contain:
    #
    #   - DockerManger-generated self-signed certificate
    #   - administrator-provided certificate
    #   - certificate managed through Certbot
    #

    ssl_certificate
        /data/certs/dockermanger.crt;

    ssl_certificate_key
        /data/certs/dockermanger.key;


    # ------------------------------------------------------------------------
    # TLS Configuration
    # ------------------------------------------------------------------------
    #
    # TLS 1.2 and TLS 1.3 provide compatibility with modern browsers while
    # avoiding obsolete SSL/TLS protocol versions.
    #

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:DockerMangerSSL:10m;
    ssl_session_timeout 1d;

    ssl_session_tickets off;


    # ------------------------------------------------------------------------
    # Basic HTTP Security Headers
    # ------------------------------------------------------------------------
    #
    # These are deliberately conservative so they do not interfere with the
    # future xterm.js / WebSocket terminal implementation.
    #
    # A Content-Security-Policy should be added once the final frontend and
    # terminal requirements are known.
    #

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;


    # ------------------------------------------------------------------------
    # HSTS
    # ------------------------------------------------------------------------
    #
    # HSTS is deliberately NOT enabled yet.
    #
    # DockerManger may initially use a self-signed certificate. Forcing HSTS
    # before certificate management is fully configured can make recovery or
    # certificate replacement unnecessarily difficult.
    #


    # ------------------------------------------------------------------------
    # HTTPS Health Endpoint
    # ------------------------------------------------------------------------
    #
    # The normal Docker health check uses HTTP internally, but exposing this
    # endpoint over HTTPS is useful for diagnostics and application checks.
    #

    location = /health {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME
            $document_root/health.php;

        fastcgi_param SCRIPT_NAME
            /health.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }


    # ------------------------------------------------------------------------
    # Static Files / Application Front Controller
    # ------------------------------------------------------------------------
    #
    # Existing files are served directly by Nginx.
    #
    # Requests that do not map to physical files are passed to index.php.
    # This leaves room for cleaner application routes later.
    #

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    # ------------------------------------------------------------------------
    # PHP
    # ------------------------------------------------------------------------
    #
    # Only PHP files that physically exist beneath the public document root
    # are executed.
    #

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME
            $document_root$fastcgi_script_name;

        fastcgi_param SCRIPT_NAME
            $fastcgi_script_name;

        # Tell PHP that this request arrived through HTTPS.
        fastcgi_param HTTPS on;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }


    # ------------------------------------------------------------------------
    # Hidden Files
    # ------------------------------------------------------------------------
    #
    # Prevent accidental exposure of files such as:
    #
    #   .env
    #   .git
    #   .htaccess
    #
    # ACME validation is handled by the HTTP server above.
    #

    location ~ /\.(?!well-known) {
        deny all;
    }


    # ------------------------------------------------------------------------
    # Request Size
    # ------------------------------------------------------------------------
    #
    # Compose files and DockerManger configuration should remain relatively
    # small.
    #

    client_max_body_size 10m;


    # ------------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------------
    #
    # stdout/stderr allows Docker's configured logging driver to handle log
    # storage and rotation.
    #

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
