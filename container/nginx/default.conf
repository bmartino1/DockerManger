# ============================================================================
# DockerManger - Nginx Configuration
# ============================================================================
#
# Nginx is the HTTP frontend for DockerManger.
#
# Request flow:
#
#   Browser
#      |
#      v
#   Nginx :80
#      |
#      +---- Static files (CSS / JavaScript / images)
#      |
#      +---- PHP requests
#               |
#               v
#          PHP-FPM 8.3
#
# DockerManger's public web root is:
#
#   /var/www/dockermanger/public
#
# Application source files outside /public are intentionally not directly
# exposed by Nginx.
#
# ============================================================================


server {
    # ------------------------------------------------------------------------
    # Listener
    # ------------------------------------------------------------------------

    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;


    # ------------------------------------------------------------------------
    # DockerManger Web Root
    # ------------------------------------------------------------------------

    root /var/www/dockermanger/public;
    index index.php;


    # ------------------------------------------------------------------------
    # Basic HTTP Security Headers
    # ------------------------------------------------------------------------
    #
    # These are intentionally conservative headers that should not interfere
    # with the future DockerManger terminal/WebSocket implementation.
    #
    # A Content-Security-Policy can be added later once the final frontend and
    # xterm.js requirements are known.
    #

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;


    # ------------------------------------------------------------------------
    # Health Check
    # ------------------------------------------------------------------------
    #
    # Docker's container HEALTHCHECK requests:
    #
    #   http://127.0.0.1/health
    #
    # The public URL is mapped directly to health.php.
    #

    location = /health {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME
            $document_root/health.php;

        fastcgi_param SCRIPT_NAME
            /health.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }


    # ------------------------------------------------------------------------
    # Static Files / Application Front Controller
    # ------------------------------------------------------------------------
    #
    # Existing files are served directly by Nginx.
    #
    # Requests that do not map to a physical file are passed to index.php.
    # This leaves us room for cleaner application routes later without
    # requiring another Nginx redesign.
    #

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    # ------------------------------------------------------------------------
    # PHP
    # ------------------------------------------------------------------------
    #
    # Only PHP files that physically exist under the public document root
    # should be executed.
    #

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME
            $document_root$fastcgi_script_name;

        fastcgi_param SCRIPT_NAME
            $fastcgi_script_name;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }


    # ------------------------------------------------------------------------
    # Hidden Files
    # ------------------------------------------------------------------------
    #
    # Prevent accidental exposure of files such as:
    #
    #   .env
    #   .git
    #   .htaccess
    #
    # The ACME exception leaves room for a future reverse-proxy/certificate
    # arrangement if required.
    #

    location ~ /\.(?!well-known) {
        deny all;
    }


    # ------------------------------------------------------------------------
    # Request Size
    # ------------------------------------------------------------------------
    #
    # Compose files and DockerManger configuration should remain relatively
    # small. This prevents unexpectedly large HTTP request bodies while still
    # leaving plenty of room for normal Compose editing.
    #

    client_max_body_size 10m;


    # ------------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------------
    #
    # Keep logs on stdout/stderr so Docker's configured logging driver handles
    # storage and rotation.
    #

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
